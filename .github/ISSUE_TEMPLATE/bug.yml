name: "Relatar um defeito"
description: "Algo do sistema não funciona como deveria."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Obrigado por relatar o defeito. **Não cole senhas, tokens, o conteúdo do arquivo `.env` nem o conteúdo de `agentes/.mcp.json` nesta issue.**"
  - type: textarea
    id: aconteceu
    attributes:
      label: "O que aconteceu?"
      description: "Descreva o comportamento que você viu."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: "O que era esperado?"
      description: "Descreva o comportamento que você esperava."
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: "Passos para reproduzir"
      description: "Liste os passos em ordem, a partir da tela de entrada."
      placeholder: "1. Entrar como ...\n2. Abrir a imagem ...\n3. Clicar em ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Área"
      description: "Em qual área o defeito aconteceu?"
      options:
        - "Imagens e projetos"
        - "Análise, referências e mapa 3D"
        - "Reconstrução e resultado"
        - "Equipe de agentes"
        - "Configurações e Canva"
        - "Instalação e atualização"
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: "Navegador ou sistema"
      description: "Por exemplo: Chrome no Windows 11, ou Firefox no Ubuntu."
    validations:
      required: false
  - type: textarea
    id: anexos
    attributes:
      label: "Prints ou logs"
      description: "Arraste imagens para esta área. Não inclua senhas, tokens nem o conteúdo do .env."
    validations:
      required: false
